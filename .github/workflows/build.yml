name: build-dyychu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate policy, callbacks and dependency preparation
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          clang -std=c11 -Wall -Wextra -Werror tests/privacy_policy_test.c -o /tmp/privacy-policy-test
          /tmp/privacy-policy-test
          clang -std=gnu11 -fobjc-arc -fblocks -framework Foundation -Wno-deprecated-declarations tests/privacy_runtime_test.m -o /tmp/privacy-runtime-test
          /tmp/privacy-runtime-test
      - name: Build the fixed arm64 library
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" -mios-version-min=14.0 \
            -std=gnu11 -fobjc-arc -fblocks -dynamiclib -O2 -fno-omit-frame-pointer \
            -install_name '@rpath/libDYYCHUnlock.dylib' \
            -framework Foundation -lobjc -Wno-deprecated-declarations \
            src/DYYCHUnlock.m src/PrivacyShield.m -o libDYYCHUnlock.dylib
          codesign --force --sign - libDYYCHUnlock.dylib
          codesign --verify libDYYCHUnlock.dylib
          file libDYYCHUnlock.dylib
          shasum -a 256 libDYYCHUnlock.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: DYYCHUnlock-fixed-arm64
          path: |
            libDYYCHUnlock.dylib
            prepare_private_copy.py
            README.md
            PRIVACY.md
